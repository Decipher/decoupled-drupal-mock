name: Release

# Publishes the engine and the presets to npm.
#
# dev: a push to a release line while changesets are pending publishes a snapshot of every package they release under
# the `dev` dist-tag, such as 1.0.0-dev.20261118084548. Nothing is committed and no git tag is made. Install one with
# `decoupled-drupal-mock@dev`. A manual run cuts one too, and does nothing else.
#
# release: while changesets are pending, a "version packages" pull request stays open against the release line.
# Merging it is the release decision. The push that follows finds versions npm does not have, publishes them, and
# creates a tag and a GitHub Release for each.
#
# Building and publishing are separate jobs. A job that runs repository code, install scripts included, holds no
# publishing rights, and ends by packing tarballs. The publishing job holds the OIDC permission and runs nothing from
# the repository. It downloads the tarballs and hands them to npm.
#
# Publishing uses npm trusted publishing (OIDC), so there is no token. It stays off until NPM_PUBLISH is `true` as a
# repository variable: the publishing jobs' `if` is read before a job enters its environment, so a variable set only on
# the release environment does not count there. The release environment can then hold the release job for a reviewer.
# Until then the packed tarballs are the dry run.

on:
  push:
    branches: ['*.x']
    paths:
      - '.changeset/**'
      - 'packages/*/package.json'
      - 'presets/*/package.json'
  # The rehearsal, for a pull request that changes how a release is made.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .changeset/config.json
      - scripts/release.mjs
      # The root manifest and the lock file hold the changesets packages themselves, so a change to either can stop a
      # release starting.
      - package.json
      - yarn.lock
      - 'packages/*/package.json'
      - 'presets/*/package.json'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish half way through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Versions the packages in a throwaway checkout and packs them, as a release would, so a changeset or a manifest that
  # would stop a release fails the pull request instead. It publishes nothing.
  rehearse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Version as the version pull request would
        run: |
          # changeset status would compare with the release line, which this shallow checkout lacks. The changesets
          # test has already read every pending changeset, and changeset version stops on one it cannot release.
          if [ "$(node scripts/release.mjs pending)" != 0 ]; then
            yarn release:version
          fi
          yarn install --immutable
          node scripts/release.mjs packages | jq -r '.[] | "- \(.name)@\(.version), under \(.tag)"' >> "$GITHUB_STEP_SUMMARY"
      - name: Pack each package and check what it holds
        run: |
          yarn workspace decoupled-drupal-mock build
          mkdir release-package
          for name in $(node scripts/release.mjs packages | jq -r '.[].name'); do
            yarn workspace "$name" pack --out "$PWD/release-package/$name.tgz"
            node scripts/release.mjs check "release-package/$name.tgz" "$name"
          done

  # Versions every package a pending changeset releases as a dev snapshot, and packs them. It runs on pull requests too,
  # as the snapshot's rehearsal. No id-token here: a lifecycle script in a pull request must not be able to reach npm.
  snapshot:
    if: github.repository == 'Decipher/decoupled-drupal-mock'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.snapshot.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      # A snapshot cannot be cut in pre mode. The checkout is thrown away, so dropping the marker here changes nothing
      # on the branch. A dev version is the only kind with the `dev` dist-tag, so that picks out what was versioned.
      - name: Version the snapshot
        id: snapshot
        run: |
          packages='[]'
          if [ "$(node scripts/release.mjs pending)" != 0 ]; then
            rm -f .changeset/pre.json
            yarn changeset version --snapshot dev
            yarn install --mode=update-lockfile
            packages=$(node scripts/release.mjs packages | jq -c '[.[] | select(.tag == "dev")]')
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "$packages" | jq -r 'if length == 0 then "No changeset is pending, so there is no snapshot." else .[] | "- \(.name)@\(.version)" end' >> "$GITHUB_STEP_SUMMARY"
      - name: Pack each snapshot and check what it holds
        if: steps.snapshot.outputs.packages != '[]'
        env:
          PACKAGES: ${{ steps.snapshot.outputs.packages }}
        run: |
          yarn workspace decoupled-drupal-mock build
          mkdir dev-package
          for name in $(echo "$PACKAGES" | jq -r '.[].name'); do
            yarn workspace "$name" pack --out "$PWD/dev-package/$name.tgz"
            node scripts/release.mjs check "dev-package/$name.tgz" "$name"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.snapshot.outputs.packages != '[]'
        with:
          name: dev-package
          path: dev-package
          retention-days: 7
          if-no-files-found: error

  # No checkout and no install: nothing from the repository runs with the OIDC permission. No environment either: npm's
  # trusted publisher holds one environment per package, and both this job and the release job publish through it.
  dev:
    needs: snapshot
    # workflow_dispatch takes no branch filter and can target a tag, so a tag named like a release line would otherwise
    # pass the suffix test.
    if: >-
      github.event_name != 'pull_request' &&
      startsWith(github.ref, 'refs/heads/') &&
      endsWith(github.ref, '.x') &&
      vars.NPM_PUBLISH == 'true' &&
      needs.snapshot.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # An exact version, and no install scripts: this job can publish. Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global --ignore-scripts npm@11.19.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dev-package
          path: dev-package
      # The engine goes first, since each preset names its exact snapshot as a peer. The leading ./ matters: npm reads
      # a bare "dir/file.tgz" as the GitHub shorthand "user/repo".
      - name: Publish under the dev tag
        shell: bash
        env:
          PACKAGES: ${{ needs.snapshot.outputs.packages }}
        run: |
          for name in $(echo "$PACKAGES" | jq -r '.[].name'); do
            npm publish "./dev-package/$name.tgz" --access public --tag dev
          done
          echo "$PACKAGES" | jq -r '.[] | "- \(.name)@\(.version), under dev"' >> "$GITHUB_STEP_SUMMARY"

  # Opens or updates the version pull request. It holds a token that can write to the repository, so it installs
  # without scripts and runs nothing but the changesets tooling. Only a push to a release line gets here, so a manual
  # run, which can name any branch or tag, never releases.
  version:
    if: github.repository == 'Decipher/decoupled-drupal-mock' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      # GitHub runs no checks on a pull request the workflow's own token opens. An app token gets them run. Without the
      # app the pull request still opens, and its checks need a manual run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        if: vars.RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Named, not inherited. Changesets hands this token to the version script, so it carries only what opening
          # the version pull request needs.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      # v2, the line that takes @changesets/cli 3. It commits through the API, so the version commit is signed. Once
      # prerelease mode is ending it counts the changesets that mode used, so leaving it opens the pull request too.
      # The title becomes the squash commit's subject, so it is a conventional commit. In prerelease mode the action
      # adds the mode's tag to it, such as " (alpha)".
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          version-script: yarn release:version
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
      # The action's description lists each changelog. This one also says which dist-tag each version takes. The
      # working tree is the version commit here.
      - name: Say what merging the version pull request releases
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          {
            echo 'Merging this pull request releases these versions to npm:'
            echo
            node scripts/release.mjs packages | jq -r '.[] | "- `\(.name)@\(.version)`, under the `\(.tag)` dist-tag"'
            for name in $(node scripts/release.mjs packages | jq -r '.[].name'); do
              notes=$(node scripts/release.mjs notes "$name")
              # An if, since a bare test that fails would be the loop's status, and end the step.
              if [ -n "$notes" ]; then
                printf '\n## %s\n\n%s\n' "$name" "$notes"
              fi
            done
          } > "$RUNNER_TEMP/body.md"
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
      # A pending changeset means its work is not finished, so nothing publishes. Say so, rather than leave a quiet run
      # that reads as a failure.
      - name: Say why nothing will publish
        if: steps.changesets.outputs.has-changesets == 'true'
        run: |
          {
            echo "### No publish this run"
            echo
            echo "Changesets are still pending, so the version pull request has been opened or updated instead."
            echo "Merging that pull request is what releases."
          } >> "$GITHUB_STEP_SUMMARY"

  # Finds the versions not fully released, and packs them with their release notes. It runs repository code, so it
  # holds no write or publishing rights.
  pack:
    needs: version
    if: needs.version.outputs.pending == 'false'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.unreleased.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Find the versions not released yet
        id: unreleased
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          packages=$(node scripts/release.mjs unreleased)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "$packages" | jq -r 'if length == 0 then "Every version is released." else .[] | "- \(.name)@\(.version) is not fully released." end' >> "$GITHUB_STEP_SUMMARY"
      # The tarballs and the release notes travel together, so the publishing job needs nothing from the repository.
      - name: Pack the tarballs and the release notes
        if: steps.unreleased.outputs.packages != '[]'
        env:
          PACKAGES: ${{ steps.unreleased.outputs.packages }}
        run: |
          yarn workspace decoupled-drupal-mock build
          mkdir release-package
          for name in $(echo "$PACKAGES" | jq -r '.[].name'); do
            yarn workspace "$name" pack --out "$PWD/release-package/$name.tgz"
            node scripts/release.mjs check "release-package/$name.tgz" "$name"
            node scripts/release.mjs notes "$name" > "release-package/$name.md"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.unreleased.outputs.packages != '[]'
        with:
          name: release-package
          path: release-package
          retention-days: 30
          if-no-files-found: error

  # No checkout and no install: nothing from the repository runs with the OIDC permission. The engine goes first,
  # since each preset names it as a peer. npm is asked again before each publish, since a rerun of this job keeps the
  # pack job's answers from before the first attempt. So a rerun skips a version an earlier attempt published, and
  # still creates a missing GitHub Release.
  release:
    needs: pack
    if: needs.pack.outputs.packages != '[]' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    # Pauses for a required reviewer before anything reaches npm.
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # An exact version, and no install scripts: this job can publish. Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global --ignore-scripts npm@11.19.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: release-package
      # The leading ./ matters: npm reads a bare "dir/file.tgz" as the GitHub shorthand "user/repo".
      - name: Publish, tag and create each GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGES: ${{ needs.pack.outputs.packages }}
        run: |
          echo "$PACKAGES" | jq -c '.[]' | while read -r pkg; do
            name=$(echo "$pkg" | jq -r .name)
            version=$(echo "$pkg" | jq -r .version)
            tag=$(echo "$pkg" | jq -r .tag)
            release="$name@$version"
            # npm answers E404 for a version or a package it does not have. Any other failure stops the job, rather
            # than publishing on a guess.
            if found=$(npm view "$release" version 2> npm-view.log) && [ -n "$found" ]; then
              state='already on npm'
              # Trusted publishing signs in only to publish, so a dist-tag a rerun finds wrong can only be reported.
              tagged=$(npm view "$name" "dist-tags.$tag" 2> /dev/null || true)
              if [ "$tagged" != "$version" ]; then
                state="already on npm, but $tag names ${tagged:-nothing}: run npm dist-tag add $release $tag"
                echo "::warning::$release is published, but the $tag dist-tag names ${tagged:-nothing}."
              fi
            elif grep -q 'code E404' npm-view.log; then
              npm publish "./release-package/$name.tgz" --access public --tag "$tag"
              state="published under $tag"
            else
              cat npm-view.log
              echo "npm could not say whether $release is published." >&2
              exit 1
            fi
            if ! gh release view "$release" > /dev/null 2>&1; then
              # Only a release npm calls latest is GitHub's latest too. A release from an older line is not a
              # prerelease, just not the latest.
              flags=(--latest=false)
              [ "$tag" = latest ] && flags=(--latest)
              case "$version" in *-*) flags+=(--prerelease) ;; esac
              gh release create "$release" --target "$GITHUB_SHA" --title "$release" --notes-file "release-package/$name.md" "${flags[@]}"
            fi
            echo "- $release ($state)" >> "$GITHUB_STEP_SUMMARY"
          done
