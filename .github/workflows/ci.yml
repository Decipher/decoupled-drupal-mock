# Build the engine, lint, typecheck, test, and the engine against the Umami preset's oracle. On a branch with no
# packages yet, such as the bare root, every step passes with nothing to do.
name: CI

on:
  push:
    branches: [1.0.x]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # One run at a time per pull request, queued rather than cancelled, so two runs never both post the rebuild comment.
    concurrency:
      group: check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    # Writing the rebuild comment is the one write this job makes.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: '[ -d packages/engine ] && yarn workspace decoupled-drupal-mock build || echo "no engine to build"'
      - run: yarn lint
      - if: github.event_name == 'pull_request'
        run: yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      # The recordings are gzipped, so the review reads what a rebuild changed here: in the job summary, and in one
      # comment each run updates. A fork's pull request has no token that may comment, so it gets the job summary only.
      - if: github.event_name == 'pull_request'
        run: yarn rebuild:summary ${{ github.event.pull_request.base.sha }} --out rebuild-summary.md
      # Also after the summary step fails, so the comment says the summary is incomplete rather than keep an earlier
      # one. That step's failure still fails the job.
      - if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository && hashFiles('rebuild-summary.md') != ''
        run: node scripts/rebuild-comment.mjs rebuild-summary.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - run: '[ -d packages ] && yarn typecheck || echo "nothing to typecheck"'
      - run: '[ -d packages ] && yarn test:coverage || echo "nothing to test"'
      # A fork's pull request has no token, so it runs the floor above and uploads nothing.
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Each runner, as a consumer uses it. Jest runs as druxt.js's 0.x branch does: Node 16, CommonJS, jsdom.
  runners:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/1.0.x'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace decoupled-drupal-mock build
      - run: yarn workspace example-playwright playwright install --with-deps chromium
      - run: yarn workspace example-playwright test
      - run: yarn workspace example-nextjs test
      - run: yarn workspace example-cypress cypress install
      - run: yarn workspace example-cypress test
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: node ../../node_modules/jest/bin/jest.js
        working-directory: examples/jest
