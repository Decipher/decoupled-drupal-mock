# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews every pull request when it opens and on each push. It
# skips a review over 100 changed files, and a rebuilt preset changes more than
# that. The filters below leave out what the build writes, so a dump rebuild
# still gets a review of the code and docs beside it.
language: en-AU
reviews:
  path_filters:
    # The recorded dumps and oracles, written by the build, never by hand.
    - '!presets/*/dump/**'
    - '!presets/*/oracle/**'
    - '!examples/overlays/**/*.json.gz'
    # Changesets writes these on each release.
    - '!**/CHANGELOG.md'
    # Lock files.
    - '!yarn.lock'
  auto_review:
    enabled: true
    drafts: false
