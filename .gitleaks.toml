# The default rules, with one allowance: a preset's manifest, and the example overlays', names each file's sha256.
# A hash of public content is not a key, though `"overlays/jsonapi-extras.json.gz": "<64 hex>"` reads like one to the
# generic rule. Only that shape, only in those manifests: anything else there is still reported.
[extend]
useDefault = true

[[allowlists]]
description = "A file's sha256 in a preset manifest"
condition = "AND"
paths = ['''^presets/[^/]+/dump/manifest\.json$''', '''^examples/overlays/manifest\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']
